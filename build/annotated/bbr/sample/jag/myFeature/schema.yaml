$schema: https://json-schema.org/draft/2020-12/schema
description: Example of a simple GeoJSON Feature specialisation
$defs:
  MyFeature:
    allOf:
    - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/feature/schema.yaml
    - properties:
        properties:
          $ref: https://raw.githubusercontent.com/avillar/bblocks-nov10-jag/master/build/annotated/bbr/sample/jag/mySchema/schema.yaml
anyOf:
- $ref: '#/$defs/MyFeature'
x-bblocks-metadata:
  itemIdentifier: iso.bbr.sample.jag.myFeature
  register: https://raw.githubusercontent.com/avillar/bblocks-nov10-jag/master/build/register.json
  version: '1.0'
  dateOfLastChange: '2023-05-19'
